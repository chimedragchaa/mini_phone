<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220">
  <defs>
    <style>
      .bg{fill:#eee5ce}.screen{fill:#ffedbb;stroke:#18283f;stroke-width:2}.navy{fill:#18283f}.card{fill:#f7e5b4}.green{fill:#337b5d}.red{fill:#bd4c50}.blue{fill:#547ea3}.orange{fill:#edae42}.ink{fill:#283348}.muted{fill:#657080}.white{fill:#fff1c6}.stroke{stroke:#18283f;stroke-width:1.4}.ttl{font:bold 14px Arial,sans-serif;fill:#fff1c6}.txt{font:12px Arial,sans-serif;fill:#283348}.small{font:10px Arial,sans-serif;fill:#657080}.btn{font:bold 12px Arial,sans-serif;fill:#fff}.label{font:bold 14px Arial,sans-serif;fill:#18283f}
    </style>
    <g id="frame">
      <rect class="screen" width="320" height="240" rx="10"/>
      <path d="M1 10Q1 1 10 1H310Q319 1 319 10V30H1Z" class="navy"/>
      <rect x="231" y="4" width="80" height="22" rx="6" class="green"/>
      <text x="239" y="19" class="white" font-family="Arial" font-size="10">GSM OK</text>
    </g>
